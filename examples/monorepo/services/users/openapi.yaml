openapi: 3.1.0
info: { title: Users, version: 2.3.0 }
paths:
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      responses:
        '200':
          description: A user.
          content:
            application/json:
              schema: { $ref: './schemas/user.yaml' }
  /internal/users/reindex:
    post:
      responses:
        '202': { description: Accepted. }
