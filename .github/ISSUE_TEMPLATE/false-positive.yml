name: False positive
description: A finding is wrong — the change is compatible, or the classification/severity is too strong.
labels: [rule, false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: CG-REQ-020
    validations:
      required: true
  - type: input
    id: classification
    attributes:
      label: Reported classification and perspective
      placeholder: 'breaking under provider-backward'
    validations:
      required: true
  - type: textarea
    id: base
    attributes:
      label: Baseline snippet
      render: yaml
    validations:
      required: true
  - type: textarea
    id: candidate
    attributes:
      label: Candidate snippet
      render: yaml
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is the verdict wrong?
      description: Explain which existing clients would still work and why.
    validations:
      required: true
