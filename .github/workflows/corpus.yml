# Weekly real-world corpus (§2.9, §18): ContractGuard vs oasdiff on version pairs of public APIs, the
# self-comparison check, and the NFR-03 benchmark on a GitHub-hosted runner. Results are uploaded as an artifact.
name: Corpus

on:
  schedule:
    - cron: '41 2 * * 0'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated source ids (default: all)'
        required: false

permissions:
  contents: read

env:
  OASDIFF_VERSION: 1.39.0
  OASDIFF_SHA256: 71a85930728f367a2086077b7ae1411319421549d18473a3e8258b6451520433

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Benchmark (NFR-03)
        run: node bench/run.mjs --runs 3 --json bench-results.json
      - name: oasdiff (checksum-verified)
        run: |
          curl -sSL -o oasdiff.tgz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tgz" | sha256sum -c -
          tar -xzf oasdiff.tgz oasdiff && ./oasdiff --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/.cache
          key: corpus-${{ hashFiles('corpus/sources.json') }}-${{ github.run_id }}
          restore-keys: corpus-${{ hashFiles('corpus/sources.json') }}-
      - name: Fetch the corpus
        env:
          ONLY: ${{ inputs.only }}
        run: node scripts/corpus/fetch.mjs ${ONLY:+--only "$ONLY"}
      - name: Run the corpus
        env:
          ONLY: ${{ inputs.only }}
        run: node scripts/corpus/run.mjs --oasdiff ./oasdiff --jobs 4 --out corpus/results/run ${ONLY:+--only "$ONLY"}
      - name: Report
        run: |
          node scripts/corpus/report.mjs corpus/results/run
          cat corpus/results/run/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-results
          path: |
            corpus/results/run/
            bench-results.json
